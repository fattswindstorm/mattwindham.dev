{% extends "base.html" %}
{% block title %}Have an opportunity? - Matthew Windham{% endblock %}

{% block content %}
<main class="wrap portal-main">
	<h1 class="page-h1">Have an opportunity?</h1>
	<p class="auth-note">
		Tell me about the role — I read every submission and reply from here, not email.
	</p>

	<form method="post" class="auth-form">
		{% csrf_token %}
		{{ form.non_field_errors }}
		{{ form.as_p }}
		<button type="submit" class="btn btn-primary auth-submit">Submit</button>
	</form>
</main>
{% endblock %}
